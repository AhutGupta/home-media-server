events {}
http {
  # MIME types
  types {
    text/html html htm;
    text/css css;
    text/javascript js;
    image/jpeg jpg jpeg;
    image/png png;
    image/svg+xml svg;
    application/json json;
  }
  default_type application/octet-stream;

  # Security headers
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header X-XSS-Protection "1; mode=block" always;
  add_header Referrer-Policy "no-referrer-when-downgrade" always;

  # Performance optimizations
  sendfile on;
  tcp_nopush on;
  tcp_nodelay on;
  keepalive_timeout 65;
  
  # Buffer sizes
  proxy_buffer_size 128k;
  proxy_buffers 4 256k;
  proxy_busy_buffers_size 256k;

  # Enable gzip compression
  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_comp_level 6;
  gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml+rss application/rss+xml font/truetype font/opentype application/vnd.ms-fontobject image/svg+xml;

  # Cache configuration for static assets
  proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=media_cache:10m max_size=1g inactive=60m use_temp_path=off;

  # Rate limiting zones
  limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
  limit_req_zone $binary_remote_addr zone=general_limit:10m rate=30r/s;

  # Logging
  log_format detailed '$remote_addr - $remote_user [$time_local] '
                      '"$request" $status $body_bytes_sent '
                      '"$http_referer" "$http_user_agent" '
                      'rt=$request_time uct="$upstream_connect_time" '
                      'uht="$upstream_header_time" urt="$upstream_response_time"';
  
  access_log /var/log/nginx/access.log detailed;

  server {
    listen 80;
    server_name media-server;

    # Disable server version disclosure
    server_tokens off;

    # Root location - serve dashboard
    location = / {
      root /etc/nginx/html;
      try_files /dashboard.html =404;
      add_header Cache-Control "no-cache";
    }

    # Health check endpoint
    location /health {
      access_log off;
      return 200 "healthy\n";
      add_header Content-Type text/plain;
    }

    # Jellyfin - Media streaming
    location /view {
      return 301 $scheme://$host:8096/;
    }

    # Jellyseerr - Content requests
    location /request {
      return 301 $scheme://$host:5055/;
    }

    # Sonarr - TV management
    location /tv {
      return 301 $scheme://$host:8989/;
    }

    # Radarr - Movie management
    location /movies {
      return 301 $scheme://$host:7878/;
    }

    # Whisparr
    location /xxx {
      return 301 $scheme://$host:6969/;
    }

    # qBittorrent
    location /torrent {
      return 301 $scheme://$host:8080/;
    }

    # Navidrome - Music streaming
    location /music {
      return 301 $scheme://$host:4533/;
    }

    # Lidarr - Music management
    location /lidarr {
      return 301 $scheme://$host:8686/;
    }

  }
}