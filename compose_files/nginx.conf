events {}
http {
  # MIME types
  types {
    text/html html htm;
    text/css css;
    text/javascript js;
    image/jpeg jpg jpeg;
    image/png png;
    image/svg+xml svg;
    application/json json;
  }
  default_type application/octet-stream;

  # Security headers
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header X-XSS-Protection "1; mode=block" always;
  add_header Referrer-Policy "no-referrer-when-downgrade" always;

  # Performance optimizations
  sendfile on;
  tcp_nopush on;
  tcp_nodelay on;
  keepalive_timeout 65;
  
  # Buffer sizes
  proxy_buffer_size 128k;
  proxy_buffers 4 256k;
  proxy_busy_buffers_size 256k;

  # Enable gzip compression
  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_comp_level 6;
  gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml+rss application/rss+xml font/truetype font/opentype application/vnd.ms-fontobject image/svg+xml;

  # Cache configuration for static assets
  proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=media_cache:10m max_size=1g inactive=60m use_temp_path=off;

  # Rate limiting zones
  limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
  limit_req_zone $binary_remote_addr zone=general_limit:10m rate=30r/s;

  # Logging
  log_format detailed '$remote_addr - $remote_user [$time_local] '
                      '"$request" $status $body_bytes_sent '
                      '"$http_referer" "$http_user_agent" '
                      'rt=$request_time uct="$upstream_connect_time" '
                      'uht="$upstream_header_time" urt="$upstream_response_time"';
  
  access_log /var/log/nginx/access.log detailed;

  server {
    listen 80;
    server_name media-server;

    # Disable server version disclosure
    server_tokens off;

    # Root location - serve dashboard
    location = / {
      root /etc/nginx/html;
      try_files /dashboard.html =404;
      add_header Cache-Control "no-cache";
    }

    # Health check endpoint
    location /health {
      access_log off;
      return 200 "healthy\n";
      add_header Content-Type text/plain;
    }

    # Jellyfin - Media streaming
    location /view/ {
      limit_req zone=general_limit burst=20 nodelay;
      
      proxy_pass http://jellyfin:8096/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      
      # WebSocket support for Jellyfin
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      
      # Increase timeouts for streaming
      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
      
      rewrite ^/view/?(.*)$ /$1 break;
    }

    # Jellyseerr - Content requests
    location /request/ {
      limit_req zone=general_limit burst=10 nodelay;
      
      proxy_pass http://jellyseerr:5055/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      rewrite ^/request/?(.*)$ /$1 break;
    }

    # Sonarr - TV management (accessible via /tv for Tailscale)
    location /tv/ {
      limit_req zone=api_limit burst=5 nodelay;
      
      proxy_pass http://sonarr:8989/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      rewrite ^/tv/?(.*)$ /$1 break;
    }

    # Radarr - Movie management (accessible via /movies for Tailscale)
    location /movies/ {
      limit_req zone=api_limit burst=5 nodelay;
      
      proxy_pass http://radarr:7878/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      rewrite ^/movies/?(.*)$ /$1 break;
    }

    # Whisparr (accessible via /xxx for Tailscale)
    location /xxx/ {
      limit_req zone=api_limit burst=5 nodelay;
      
      proxy_pass http://whisparr:6969/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      rewrite ^/xxx/?(.*)$ /$1 break;
    }

    # qBittorrent (accessible via /torrent for Tailscale)
    location /torrent/ {
      limit_req zone=api_limit burst=5 nodelay;
      
      proxy_pass http://qbittorrent:8080/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      rewrite ^/torrent/?(.*)$ /$1 break;
    }

    # Navidrome - Music streaming
    location /music/ {
      limit_req zone=general_limit burst=20 nodelay;
      
      proxy_pass http://navidrome:4533/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      
      # WebSocket support for Navidrome
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      
      # Longer timeout for music streaming
      proxy_read_timeout 1800s;
      proxy_send_timeout 1800s;
    }

    # Cache static assets from media services
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf)$ {
      proxy_pass http://jellyfin:8096;
      proxy_cache media_cache;
      proxy_cache_valid 200 60m;
      proxy_cache_valid 404 1m;
      add_header X-Cache-Status $upstream_cache_status;
      expires 1h;
    }
  }
}